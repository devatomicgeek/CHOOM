<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10120e"><title>CHOOM v1.2 | CTRL Hub for Online Operations & Memory</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color-scheme:dark;--bg:#10120e;--surface:#191c16;--surface2:#23271e;--line:#454b38;--fg:#f0f1e8;--muted:#a0a797;--lime:#d7ff3f;--ink:#10120e;--danger:#ff8d82}body.light{color-scheme:light;--bg:#f3f3e9;--surface:#fffef5;--surface2:#e7eadc;--line:#aeb49f;--fg:#1a2115;--muted:#596451;--lime:#7b9900;--ink:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}button{border:1px solid var(--line);background:var(--surface2);color:var(--fg);padding:11px 13px}button:hover{border-color:var(--lime)}button.primary{background:var(--lime);color:var(--ink);font-weight:900;border-color:var(--lime)}button:disabled{opacity:.5;cursor:not-allowed}input,textarea,select{width:100%;background:var(--surface2);border:1px solid var(--line);padding:12px;color:var(--fg);border-radius:0}textarea{resize:vertical;min-height:100px}a{color:var(--lime)}.mono,.eyebrow,.nav button,.status,.tag,.micro{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.eyebrow{font-size:11px;letter-spacing:.13em;color:var(--lime);text-transform:uppercase}.micro{font-size:11px;color:var(--muted)}.shell{display:grid;grid-template-columns:246px minmax(0,1fr);min-height:100dvh}.sidebar{border-right:1px solid var(--line);padding:25px 15px;display:flex;flex-direction:column;gap:26px;background:var(--surface)}.logo{font-size:42px;letter-spacing:-.07em;line-height:1;font-weight:1000;color:var(--lime)}.logo span{font-weight:400}.sublogo{font-size:10px;line-height:1.5;color:var(--muted);letter-spacing:.06em;margin-top:10px}.nav{display:grid;gap:5px}.nav button{text-align:left;background:transparent;border:1px solid transparent;padding:13px 12px;font-size:12px;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}.nav button.active{background:var(--lime);color:var(--ink);font-weight:900}.nav button:hover:not(.active){border-color:var(--line)}.nav button b{font-weight:400;opacity:.65}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding-top:18px;display:grid;gap:9px}.main{min-width:0;display:flex;flex-direction:column}.top{padding:16px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.topright{display:flex;gap:8px;align-items:center}.status{font-size:11px;color:var(--lime)}.content{padding:27px 30px;max-width:1300px;width:100%;margin:auto;flex:1}.head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:24px}.head h1{font-size:clamp(30px,5vw,58px);letter-spacing:-.065em;text-transform:uppercase;margin:7px 0 0;line-height:.96}.head p{color:var(--muted);font-size:13px;max-width:450px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:var(--surface);border:1px solid var(--line);padding:19px;min-width:0}.card h3{margin:10px 0;font-size:19px;letter-spacing:-.03em}.card p{color:var(--muted);font-size:13px;line-height:1.55}.card .num{font-size:38px;color:var(--lime);font-weight:900}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.tag{border:1px solid var(--line);font-size:10px;padding:6px 8px;color:var(--muted);text-transform:uppercase}.accent{color:var(--lime)}.chatbox{display:grid;grid-template-rows:minmax(300px,1fr) auto;min-height:min(65vh,650px);border:1px solid var(--line);background:var(--surface)}.messages{padding:22px;overflow-y:auto;max-height:65vh;display:flex;flex-direction:column;gap:17px}.bubble{max-width:85%;border:1px solid var(--line);padding:14px 16px;line-height:1.6;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{align-self:flex-end;background:var(--surface2)}.bubble.ai{align-self:flex-start;border-left:3px solid var(--lime)}.who{font:10px ui-monospace,monospace;letter-spacing:.1em;color:var(--lime);margin-bottom:8px}.composer{display:flex;gap:9px;border-top:1px solid var(--line);padding:12px}.composer textarea{min-height:54px;max-height:145px;flex:1}.composer button{min-width:100px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}.item{padding:15px;border:1px solid var(--line);background:var(--surface);margin-bottom:10px}.item h3{margin:0 0 8px;font-size:16px}.item p{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.item a{overflow-wrap:anywhere}.item small{color:var(--muted)}.form{display:grid;gap:10px}.form label{font:11px ui-monospace,monospace;color:var(--muted);text-transform:uppercase}.form .field{display:grid;gap:5px}.form .actions{display:flex;justify-content:flex-end;gap:8px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.empty{border:1px dashed var(--line);padding:35px;text-align:center;color:var(--muted);font-size:13px}.hidden{display:none!important}.bar{height:5px;background:var(--line);overflow:hidden}.bar>span{height:100%;width:36%;display:block;background:var(--lime);animation:load 1.1s linear infinite}@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(330%)}}.cursor:after{content:'▌';color:var(--lime);animation:blink .7s step-end infinite}@keyframes blink{50%{opacity:0}}.hero{border:1px solid var(--line);background:linear-gradient(125deg,var(--surface),var(--bg));padding:28px;margin-bottom:15px;position:relative;overflow:hidden}.hero:before{content:'';position:absolute;right:-50px;top:-90px;width:300px;height:300px;border:1px solid var(--line);border-radius:50%;box-shadow:0 0 0 35px var(--bg),0 0 0 36px var(--line),0 0 0 70px var(--bg),0 0 0 71px var(--line);opacity:.55;pointer-events:none}.hero h2{position:relative;font-size:clamp(28px,5vw,58px);line-height:.98;letter-spacing:-.06em;margin:15px 0}.hero p{position:relative;max-width:460px;color:var(--muted);line-height:1.5}.hero .row{position:relative}.notice{border-left:3px solid var(--lime);background:var(--surface2);padding:12px 15px;font-size:12px;line-height:1.6;color:var(--fg);margin-bottom:16px}.danger{color:var(--danger)}.switch{font-size:12px}.mobile-menu{display:none}.overlay{display:none}body.light .primary{color:#fff}body.light .nav button.active{color:#fff}body.light .logo{color:#627e00}body.light .eyebrow,body.light .accent,body.light .status{color:#627e00}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}.content{padding:22px 17px}.top{padding:14px 17px}}@media(max-width:680px){.shell{display:block}.sidebar{position:fixed;z-index:20;inset:0 auto 0 0;width:min(82vw,290px);transform:translateX(-105%);transition:transform .2s;box-shadow:20px 0 50px #0007}.sidebar.open{transform:none}.overlay.open{display:block;position:fixed;inset:0;background:#0009;z-index:19}.mobile-menu{display:inline-block}.top{position:sticky;top:0;z-index:10;background:var(--bg)}.top .status{font-size:10px}.grid{grid-template-columns:1fr}.head{display:block}.head h1{font-size:37px}.chatbox{min-height:65dvh}.messages{max-height:58dvh;padding:12px}.bubble{max-width:95%;font-size:13px}.composer{padding:8px}.composer button{min-width:65px;padding:8px}.hero{padding:22px}.hero:before{opacity:.2}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div class="overlay" id="overlay"></div><div class="shell"><aside class="sidebar" id="sidebar"><div><div class="logo">CHOOM<span>_</span></div><div class="sublogo">CTRL HUB FOR ONLINE<br>OPERATIONS & MEMORY<br><span class="accent">BUILD 01.1 / PERSONAL SYSTEM</span></div></div><nav class="nav" id="nav"></nav><div class="sidefoot"><div class="eyebrow">SYSTEM // LOCAL FIRST</div><div class="micro" id="engineStatus">AI ENGINE: NOT CONNECTED</div><div class="micro">PRIVATE BROWSER DATA / DEVICE ONLY</div><button id="themeBtn" class="switch">◐ SWITCH THEME</button></div></aside><main class="main"><header class="top"><div class="row"><button class="mobile-menu" id="menuBtn" aria-label="Open navigation">☰</button><span class="eyebrow">CHOOM / <span id="pageCode">DASHBOARD</span></span></div><div class="topright"><span class="status" id="topStatus">● LOCAL MODE</span><span class="tag">V1.2</span></div></header><div class="content" id="content"></div></main></div><script type="module">
const KEY='choom_v12_data';let old=null;try{old=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('choom_v11_data')||'null')}catch(e){old=null}const initial={notes:[],projects:[],inspiration:[],brands:[],chat:[],theme:'dark',engine:'none',ollamaUrl:'http://localhost:11434',ollamaModel:'',browserModel:'Qwen2.5-0.5B-Instruct-q4f16_1-MLC'};let state={...initial,...(old||{})};let page='dashboard',busy=false,webEngine=null,ollamaModels=[],typingTimer=null,engineVerified=false,aiHealth='NOT TESTED',loadInProgress=false;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Local storage is full. Export your data from Settings.')}};const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const now=()=>new Date().toLocaleString();const nav=[['dashboard','01','OVERVIEW'],['chat','02','AI CHAT'],['research','03','RESEARCH'],['inspiration','04','INSPIRATION'],['notes','05','NOTES'],['projects','06','PROJECTS'],['brands','07','DESIGN SYSTEMS'],['settings','08','SYSTEM SETUP']];function navigate(p){page=p;$('#sidebar').classList.remove('open');$('#overlay').classList.remove('open');render()};function renderNav(){$('#nav').innerHTML=nav.map(([p,n,label])=>`<button data-nav="${p}" class="${p===page?'active':''}"><span>${n} / ${label}</span><b>${p===page?'↗':'+'}</b></button>`).join('');document.querySelectorAll('[data-nav]').forEach(x=>x.onclick=()=>navigate(x.dataset.nav))};const heading=(code,title,desc)=>`<div class="head"><div><div class="eyebrow">${code} // CHOOM SYSTEM</div><h1>${title}</h1></div><p>${desc}</p></div>`;const btn=(text,act,primary=false)=>`<button class="${primary?'primary':''}" data-action="${act}">${text}</button>`;function render(){renderNav();$('#pageCode').textContent=page.toUpperCase();$('#engineStatus').textContent='AI ENGINE: '+(webEngine&&engineVerified?'BROWSER VERIFIED':state.engine==='browser'&&webEngine?'BROWSER UNVERIFIED':state.engine==='ollama'?'OLLAMA CONFIGURED':state.engine==='browser'?'BROWSER MODEL NOT LOADED':'NOT CONNECTED');$('#topStatus').textContent=webEngine&&engineVerified?'● BROWSER AI VERIFIED':webEngine?'● AI TEST PENDING':state.engine==='ollama'?'● OLLAMA SELECTED':'● LOCAL MODE';$('#content').innerHTML=({dashboard,chat,research,inspiration,notes,projects,brands,settings})[page]();wire();}function dashboard(){return `${heading('00','WELCOME, SIR.','Your personal creative command center. Research, organize, and connect your design systems.') }<section class="hero"><div class="eyebrow">CTRL / HUB FOR ONLINE OPERATIONS & MEMORY</div><h2>CREATIVE<br><span class="accent">INTELLIGENCE_</span></h2><p>Good to have you back, Mr Jan. Your projects, notes, and references are ready. Activate a local AI engine in System Setup when you want intelligent responses.</p><div class="row">${btn('OPEN AI CHAT ↗','chat',true)}${btn('SYSTEM SETUP ↗','settings')}</div></section><div class="grid"><div class="card"><div class="eyebrow">01 / MEMORY</div><div class="num">${state.notes.length.toString().padStart(2,'0')}</div><p>Saved notes</p></div><div class="card"><div class="eyebrow">02 / WORKSPACE</div><div class="num">${state.projects.length.toString().padStart(2,'0')}</div><p>Active projects</p></div><div class="card"><div class="eyebrow">03 / CONNECTIONS</div><div class="num">${state.brands.length.toString().padStart(2,'0')}</div><p>Design system URLs</p></div></div><div class="card" style="margin-top:14px"><div class="eyebrow">SYSTEM BULLETIN</div><p>CHOOM v1.2 stores your workspace in this browser. The local AI is optional and requires model setup and a successful test response. Research links open public search websites; automated browsing is not yet enabled.</p></div>`}function chat(){return `${heading('01','AI CHAT_','Converse with a local AI model. Text appears with terminal-style typing when responses arrive.')}<div class="notice" id="chatNotice">${state.engine==='none'?'No AI connected. Go to System Setup to configure Ollama or browser AI.':state.engine==='browser'&&!webEngine?'Browser AI selected. Open System Setup and load the model before chatting.':state.engine==='ollama'?'Ollama selected. Ensure your computer is running Ollama and the configured model is installed.':engineVerified?'Local browser AI verified with a successful test response.':'Browser model loaded, but not yet verified.'}</div><div class="toolbar"><span class="micro">${state.chat.length} MESSAGES / STORED ON THIS DEVICE</span>${btn('CLEAR CHAT','clearChat')}</div><div class="chatbox"><div class="messages" id="messages">${state.chat.length?state.chat.map(m=>`<div class="bubble ${m.role==='user'?'user':'ai'}"><div class="who">${m.role==='user'?'MR JAN / INPUT':'CHOOM / OUTPUT'}</div><div>${esc(m.content)}</div></div>`).join(''):'<div class="bubble ai"><div class="who">CHOOM / SYSTEM</div>Good day, Sir. Configure a local AI engine in System Setup, and I will be ready to assist with your creative work.</div>'}</div><form class="composer" id="chatForm"><textarea id="prompt" aria-label="Message CHOOM" placeholder="Ask CHOOM about your project..." rows="2" required></textarea><button class="primary" id="sendBtn" type="submit">SEND ↗</button></form></div>`}function research(){return `${heading('02','RESEARCH_','Find design references through public search services. Automated AI web research is a future integration.')}<div class="card"><div class="eyebrow">EXTERNAL SEARCH / OPEN IN NEW TAB</div><form id="researchForm" class="form" style="margin-top:15px"><div class="field"><label>What are we researching?</label><input name="q" placeholder="e.g. brutalist Italian restaurant poster" required></div><div class="row"><button type="submit" name="site" value="pinterest" class="primary">PINTEREST ↗</button><button type="submit" name="site" value="behance">BEHANCE ↗</button><button type="submit" name="site" value="google">GOOGLE ↗</button></div></form></div><div class="notice" style="margin-top:15px">External search websites require internet access. Their results are not automatically imported into CHOOM. Save useful links in Inspiration.</div>`}const form=(kind,fields)=>`<form class="form" id="${kind}Form">${fields.map(f=>`<div class="field"><label>${f.label}</label>${f.type==='textarea'?`<textarea name="${f.name}" placeholder="${f.placeholder||''}" ${f.required?'required':''}></textarea>`:`<input name="${f.name}" type="${f.type||'text'}" placeholder="${f.placeholder||''}" ${f.required?'required':''}>`}</div>`).join('')}<div class="actions"><button class="primary" type="submit">+ SAVE ${kind.toUpperCase()}</button></div></form>`;function list(kind){return state[kind].length?state[kind].slice().reverse().map(x=>`<article class="item"><div class="row between"><div class="eyebrow">${esc(x.category||kind)} / ${esc(x.date||'')}</div><button data-delete="${kind}:${x.id}" aria-label="Delete item">× DELETE</button></div><h3>${esc(x.title)}</h3>${x.description?`<p>${esc(x.description)}</p>`:''}${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">OPEN LINK ↗</a>`:''}</article>`).join(''):'<div class="empty">NO ENTRIES YET. ADD YOUR FIRST ONE ABOVE.</div>'}function inspiration(){return `${heading('03','INSPIRATION_','Build a private collection of visual references and ideas.') }<div class="cols"><div class="card"><div class="eyebrow">ADD REFERENCE</div>${form('inspiration',[{name:'title',label:'Reference name',required:true},{name:'url',label:'Reference URL',type:'url',required:true,placeholder:'https://...'},{name:'description',label:'Notes',type:'textarea'}])}</div><div>${list('inspiration')}</div></div>`}function notes(){return `${heading('04','NOTES_','Capture your ideas, observations, and creative directions.') }<div class="cols"><div class="card"><div class="eyebrow">NEW NOTE</div>${form('notes',[{name:'title',label:'Note title',required:true},{name:'description',label:'Note',type:'textarea',required:true}])}</div><div>${list('notes')}</div></div>`}function projects(){return `${heading('05','PROJECTS_','Keep track of ongoing creative work.') }<div class="cols"><div class="card"><div class="eyebrow">NEW PROJECT</div>${form('projects',[{name:'title',label:'Project name',required:true},{name:'description',label:'Brief / description',type:'textarea'}])}</div><div>${list('projects')}</div></div>`}function brands(){return `${heading('06','DESIGN SYSTEMS_','Register the URLs of your GitHub Pages brand guideline websites.') }<div class="notice">v1.2 saves design-system links. It does not automatically extract brand guidelines. To use guidelines in AI chat, paste relevant details into the chat or your notes.</div><div class="cols"><div class="card"><div class="eyebrow">CONNECT A DESIGN SYSTEM</div>${form('brands',[{name:'title',label:'Brand name',required:true},{name:'url',label:'Published design system URL',type:'url',required:true,placeholder:'https://yourname.github.io/...'},{name:'description',label:'Brand notes',type:'textarea'}])}</div><div>${list('brands')}</div></div>`}function settings(){return `${heading('07','SYSTEM SETUP_','Choose where CHOOM thinks. Local inference requires your device resources.') }<div class="notice">Local AI is not automatically available. Browser AI needs WebGPU support and a successful inference test, internet for the first model download, and sufficient RAM. Ollama requires a running local server. Android support depends on your browser and hardware.</div><div class="cols"><div class="card"><div class="eyebrow">01 / AI ENGINE</div><div class="form" style="margin-top:15px"><div class="field"><label>Engine</label><select id="engineSelect"><option value="none" ${state.engine==='none'?'selected':''}>None / UI only</option><option value="browser" ${state.engine==='browser'?'selected':''}>Browser AI (experimental, WebGPU)</option><option value="ollama" ${state.engine==='ollama'?'selected':''}>Ollama (desktop local server)</option></select></div><div id="browserSettings" class="${state.engine==='browser'?'':'hidden'}"><div class="field"><label>Browser model</label><select id="browserModel"><option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC">Qwen2.5 0.5B (lightweight)</option><option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen2.5 1.5B (heavier)</option></select></div><div class="row" style="margin-top:12px"><button class="primary" id="loadModel">LOAD & VERIFY AI</button><button id="unloadModel">UNLOAD</button><button id="testBrowser">TEST RESPONSE</button></div><p class="micro" id="aiHealth">STATUS: ${esc(aiHealth)}</p><div class="notice" style="margin-top:10px">Recommended for your 16 GB RAM Android: start with Qwen2.5 0.5B. Extended RAM is slower than physical RAM. If WebGPU fails, CHOOM will disable the broken session rather than claiming it is ready. CPU inference is not included in this browser runtime.</div><button id="deviceCheck" style="margin-top:10px">RUN DEVICE CHECK</button><pre id="deviceResult" style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px"></pre><p class="micro" id="loadProgress">Not loaded. Model weights may be hundreds of MB or more.</p><div class="bar hidden" id="progressBar"><span></span></div></div><div id="ollamaSettings" class="${state.engine==='ollama'?'':'hidden'}"><div class="field"><label>Ollama endpoint</label><input id="ollamaUrl" value="${esc(state.ollamaUrl)}" placeholder="http://localhost:11434"></div><div class="field" style="margin-top:10px"><label>Model name</label><input id="ollamaModel" value="${esc(state.ollamaModel)}" placeholder="qwen2.5:1.5b"></div><div class="row" style="margin-top:12px"><button id="testOllama" class="primary">TEST CONNECTION</button></div><p class="micro" id="ollamaResult">Install Ollama and pull a model on your computer first. Cross-origin browser requests may require Ollama origin configuration. Avoid exposing Ollama publicly.</p></div></div></div><div class="card"><div class="eyebrow">02 / PERSONAL DATA</div><h3>LOCAL WORKSPACE</h3><p>Notes, projects, references, design-system links, and chat history are stored in this browser's localStorage. They are not encrypted or synchronized and may be lost if browser data is cleared.</p><div class="form"><button id="exportBtn" class="primary">EXPORT DATA (.JSON) ↗</button><label for="importFile" style="display:block;padding:12px;border:1px solid var(--line);cursor:pointer">IMPORT DATA (.JSON) ↗</label><input type="file" id="importFile" accept="application/json,.json" style="display:none"><button id="wipeBtn">RESET LOCAL WORKSPACE</button></div></div></div><div class="card" style="margin-top:15px"><div class="eyebrow">03 / DEVICE NOTES</div><p><b>Desktop:</b> Ollama is usually the most dependable option. Start the local server, download a compatible model, and configure the URL above.</p><p><b>Android:</b> Browser AI is experimental and may not work on all phones. WebGPU availability, model memory, and browser restrictions determine whether it can run. A model that works on desktop may fail on mobile.</p><p><b>Offline:</b> Notes work offline after opening the HTML. Browser AI needs its code and model files available in cache; first-time setup requires internet. External web research always requires internet.</p></div>`}function wire(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(b.dataset.action==='clearChat'){if(confirm('Clear chat history on this device?')){state.chat=[];save();render()}}else navigate(b.dataset.action)});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const [kind,key]=b.dataset.delete.split(':');if(confirm('Delete this entry?')){state[kind]=state[kind].filter(x=>x.id!==key);save();render()}});['inspiration','notes','projects','brands'].forEach(kind=>{const f=$('#'+kind+'Form');if(f)f.onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(f));if(o.url){try{const u=new URL(o.url);if(!['http:','https:'].includes(u.protocol))throw 0}catch{alert('Use an http or https URL.');return}}state[kind].push({id:id(),date:now(),...o});save();render()}});const cf=$('#chatForm');if(cf){cf.onsubmit=async e=>{e.preventDefault();await sendChat()};$('#prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();cf.requestSubmit()}};const box=$('#messages');box.scrollTop=box.scrollHeight}const rf=$('#researchForm');if(rf)rf.onsubmit=e=>{e.preventDefault();const q=rf.elements.q.value.trim();if(!q)return;const site=e.submitter?.value||'google';const u=site==='pinterest'?'https://www.pinterest.com/search/pins/?q='+encodeURIComponent(q):site==='behance'?'https://www.behance.net/search/projects?search='+encodeURIComponent(q):'https://www.google.com/search?q='+encodeURIComponent(q);window.open(u,'_blank','noopener,noreferrer')};const es=$('#engineSelect');if(es)es.onchange=()=>{state.engine=es.value;save();render()};const bm=$('#browserModel');if(bm){bm.value=state.browserModel;bm.onchange=()=>{state.browserModel=bm.value;save()}};const lm=$('#loadModel');if(lm)lm.onclick=loadBrowserAI;const tb=$('#testBrowser');if(tb)tb.onclick=verifyBrowserAI;const dc=$('#deviceCheck');if(dc)dc.onclick=deviceCheck;const um=$('#unloadModel');if(um)um.onclick=async()=>{if(webEngine){try{await webEngine.unload()}catch(e){}webEngine=null}engineVerified=false;aiHealth='UNLOADED';render()};const ou=$('#ollamaUrl');if(ou)ou.onchange=()=>{state.ollamaUrl=ou.value.trim().replace(/\/$/,'');save()};const om=$('#ollamaModel');if(om)om.onchange=()=>{state.ollamaModel=om.value.trim();save()};const test=$('#testOllama');if(test)test.onclick=testOllama;const exp=$('#exportBtn');if(exp)exp.onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CHOOM_v1.2_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};const imp=$('#importFile');if(imp)imp.onchange=async()=>{try{const data=JSON.parse(await imp.files[0].text());if(!['notes','projects','inspiration','brands','chat'].every(k=>Array.isArray(data[k])))throw Error('Invalid CHOOM backup');if(confirm('Replace current local data with imported backup?')){state={...initial,...data,engine:'none'};save();render()}}catch(e){alert('Import failed: '+e.message)}};const wipe=$('#wipeBtn');if(wipe)wipe.onclick=()=>{if(confirm('Erase all CHOOM data in this browser? This cannot be undone.')){state={...initial};save();render()}}}async function sendChat(){if(busy)return;const input=$('#prompt');const text=input.value.trim();if(!text)return;if(state.engine==='none'){alert('Select an AI engine in System Setup first.');return}if(state.engine==='browser'&&(!webEngine||!engineVerified)){alert('The browser AI has not passed its response test. Open System Setup and select LOAD & VERIFY AI.');return}busy=true;state.chat.push({role:'user',content:text});input.value='';save();render();const msg=$('#messages');const el=document.createElement('div');el.className='bubble ai';el.innerHTML='<div class="who">CHOOM / THINKING</div><div class="cursor">Processing locally...</div>';msg.append(el);msg.scrollTop=msg.scrollHeight;let answer='';try{const system='You are CHOOM, a private creative research and note-taking assistant. Address the user naturally as Sir or Mr Jan, not in every sentence. Be helpful, concise and truthful. You cannot browse the live web or access design system websites directly. Never pretend to have visited a URL. Local workspace context follows:\n'+JSON.stringify({projects:state.projects.slice(-12),notes:state.notes.slice(-15),brands:state.brands.slice(-12),inspiration:state.inspiration.slice(-10)}).slice(0,14000);const messages=[{role:'system',content:system},...state.chat.slice(-16).map(x=>({role:x.role==='user'?'user':'assistant',content:x.content}))];if(state.engine==='browser'){const r=await webEngine.chat.completions.create({messages,temperature:.65,max_tokens:500});answer=r.choices?.[0]?.message?.content||'No response was returned.'}else{const url=state.ollamaUrl.replace(/\/$/,'')+'/api/chat';const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:state.ollamaModel||'qwen2.5:1.5b',messages,stream:false})});if(!response.ok)throw Error('Ollama HTTP '+response.status);const data=await response.json();answer=data.message?.content||'No response was returned.'}}catch(e){const gpu=/GPUBuffer|mapAsync|device lost|Instance reference|WebGPU|out of memory/i.test(String(e));if(gpu){engineVerified=false;aiHealth='GPU FAILURE: '+String(e.message||e);try{await webEngine?.unload()}catch(_){}webEngine=null}answer='Local AI request failed: '+e.message+'\n\n'+(gpu?'GPU session was reset. Try a smaller model and a normal HTTPS page, then reload and verify the AI in System Setup. CPU fallback is not supported by this runtime.':'Check System Setup and your device compatibility.');}state.chat.push({role:'assistant',content:answer});save();const body=el.lastElementChild;body.textContent='';body.className='cursor';let i=0;const step=()=>{i=Math.min(answer.length,i+Math.max(3,Math.ceil(answer.length/100)));body.textContent=answer.slice(0,i);msg.scrollTop=msg.scrollHeight;if(i<answer.length)typingTimer=setTimeout(step,14);else{body.className='';busy=false}};step()}async function deviceCheck(){const el=$('#deviceResult');if(!el)return;const lines=['Browser: '+navigator.userAgent,'Page origin: '+location.protocol,'Secure context: '+(isSecureContext?'YES':'NO'),'WebGPU API: '+(!!navigator.gpu?'AVAILABLE':'UNAVAILABLE'),'Reported device memory: '+(navigator.deviceMemory||'not reported')+' GB'];if(navigator.gpu){try{const adapter=await navigator.gpu.requestAdapter();lines.push('GPU adapter: '+(adapter?'AVAILABLE':'NOT FOUND'));if(adapter){const d=await adapter.requestDevice();lines.push('GPU device: '+(d?'CREATED':'FAILED'));d.destroy()}}catch(e){lines.push('GPU test error: '+e.message)}}if(location.protocol==='content:'||location.protocol==='file:')lines.push('TIP: Local file access may restrict model downloads and caching. Try an HTTPS hosted page.');el.textContent=lines.join('\n')}
async function verifyBrowserAI(){const info=$('#loadProgress');if(!webEngine){if(info)info.textContent='Load a model first.';return false}aiHealth='RUNNING INFERENCE TEST';if(info)info.textContent='Running a short real inference test...';try{const r=await webEngine.chat.completions.create({messages:[{role:'user',content:'Reply with exactly READY.'}],temperature:0,max_tokens:12});const answer=r.choices?.[0]?.message?.content||'';if(!answer.trim())throw Error('Empty test response');engineVerified=true;aiHealth='VERIFIED / RESPONSE: '+answer.slice(0,50);if(info)info.textContent=aiHealth;render();return true}catch(e){engineVerified=false;aiHealth='TEST FAILED: '+e.message;if(info)info.textContent=aiHealth;try{await webEngine?.unload()}catch(_){}webEngine=null;render();return false}}
async function loadBrowserAI(){if(loadInProgress)return;const info=$('#loadProgress'),bar=$('#progressBar'),b=$('#loadModel');if(!navigator.gpu){info.textContent='WebGPU unavailable. This browser engine has no CPU fallback. Try a compatible Chrome/WebGPU device or Ollama on a computer.';return}loadInProgress=true;engineVerified=false;aiHealth='LOADING MODEL';b.disabled=true;bar.classList.remove('hidden');info.textContent='Loading local AI model...';try{const webllm=await import('https://esm.run/@mlc-ai/web-llm');if(webEngine){try{await webEngine.unload()}catch(_){}}webEngine=await webllm.CreateMLCEngine(state.browserModel,{initProgressCallback:p=>{if(info)info.textContent=p.text||`Loading ${Math.round((p.progress||0)*100)}%`}});state.engine='browser';save();const passed=await verifyBrowserAI();if(!passed)alert('Model loaded but could not complete an inference test. It is NOT ready. Check System Setup diagnostics.');else alert('Local AI verified with a real response. CHOOM is ready.')}catch(e){engineVerified=false;webEngine=null;aiHealth='LOAD FAILED: '+e.message;if(info)info.textContent=aiHealth;alert('Browser AI failed to load. Open System Setup for diagnostics.')}finally{loadInProgress=false;bar.classList.add('hidden');if(b)b.disabled=false;render()}}
async function testOllama(){const out=$('#ollamaResult');out.textContent='Connecting...';try{const r=await fetch(state.ollamaUrl.replace(/\/$/,'')+'/api/tags');if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();ollamaModels=d.models||[];out.textContent='Connected. Installed models: '+(ollamaModels.map(m=>m.name).join(', ')||'none; install a model first')}catch(e){out.textContent='Connection failed: '+e.message+'. If opening HTML as a file, browser CORS rules may block Ollama. Configure OLLAMA_ORIGINS for the exact page origin or serve CHOOM locally.'}}$('#menuBtn').onclick=()=>{$('#sidebar').classList.add('open');$('#overlay').classList.add('open')};$('#overlay').onclick=()=>{$('#sidebar').classList.remove('open');$('#overlay').classList.remove('open')};$('#themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';document.body.classList.toggle('light',state.theme==='light');save()};document.body.classList.toggle('light',state.theme==='light');render();
</script></body></html>
